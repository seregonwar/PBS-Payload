:root{color-scheme:dark;--ink:#111111;--panel:#171716;--raised:#1f1e1c;--line:#302e2b;--paper:#ebe7e0;--muted:#8f8a82;--signal:#dc5236;--signal-soft:#3a2118;--ok:#7dd692;--ok-soft:#1a4830;--warn:#f0a35e;--r:18px;--viewer-width:1440px}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.5 Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;min-height:76px;flex-wrap:nowrap;overflow-x:auto;padding:14px 28px;background:rgba(17,17,17,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mark{display:block;width:36px;height:36px;object-fit:contain}
h1{font-size:18px;font-weight:650;margin:0;letter-spacing:.01em}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:4px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip:empty{display:none}
#stats{min-width:290px;justify-content:center}#latency{min-width:170px;justify-content:center}#audiostats{min-width:300px;justify-content:center}
#audiostats:empty{display:inline-flex;visibility:hidden}
#platform:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
body[data-state=live] #platform{background:var(--ok-soft);border-color:#245c3e;color:var(--ok)}
body[data-state=live] #platform:before{background:var(--ok);box-shadow:0 0 0 4px rgba(125,214,146,.18)}
body[data-state=error] #platform{background:var(--signal-soft);border-color:#5a2f22;color:var(--warn)}
body[data-state=error] #platform:before{background:var(--warn)}
#stats{color:var(--paper)}#audiostats{color:#c9bfae}#latency{color:var(--muted)}
.spacer{flex:1;min-width:0}
main{max-width:1480px;margin:0 auto;padding:24px 28px 40px}
.video-shell{position:relative;width:100%;max-width:var(--viewer-width);margin:0 auto;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 24px 60px rgba(0,0,0,.45)}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.banner{position:absolute;right:16px;bottom:56px;z-index:2;width:22%;max-width:220px;min-width:90px;pointer-events:none;opacity:.85}
.banner img{display:block;width:100%;height:auto}
.dock,#profile-controls,#record-info,h2,.recordings,.foot{width:100%;max-width:var(--viewer-width);margin-left:auto;margin-right:auto}
.dock{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 14px;margin-top:16px;margin-bottom:6px;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.dock .group{display:flex;flex-wrap:nowrap;align-items:center;gap:10px}
.dock .grow{margin-left:0}
button,a.btn,.recordings a{font:inherit;font-size:14px;color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:9px 18px;background:var(--raised);text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover,a.btn:hover,.recordings a:hover{background:#2a2825;border-color:#46423d}
button:active{transform:translateY(1px)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
#record{min-width:145px;background:var(--signal);border-color:var(--signal);color:#fff;font-weight:600}
#record:hover{background:#e8664b}
#record.active{background:#8d2b1d;border-color:#b53b2a}
#record.active:before{content:"";display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
#audio{min-width:120px}#audio.active{background:var(--ok-soft);border-color:#245c3e;color:var(--ok)}
.audio-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:4px 6px 4px 4px;border-radius:999px}
.audio-controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.audio-controls input[type=range]{width:120px;accent-color:var(--signal)}
#delayval{min-width:48px;color:var(--paper);font-variant-numeric:tabular-nums}
#download[hidden]{display:none}
h2{margin:30px 0 12px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#record-info{margin:10px 4px 0;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.recordings{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted)}
.recordings a{border-radius:14px;padding:11px 16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px 20px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
#message{margin:0;padding:6px 14px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);font-size:13px}
body[data-state=live] #message{color:var(--ok);border-color:#245c3e;background:var(--ok-soft)}
.foot small{grid-column:1/-1}small{color:var(--muted);font-size:12.5px}
#stop{background:transparent;color:#f1a08f;border-color:#5a2f22;font-size:13px}
#stop:hover{background:var(--signal-soft);border-color:#7c3a29}
@media (max-width:900px){.dock{grid-template-columns:1fr}.dock .group{flex-wrap:wrap}.audio-controls input[type=range]{width:96px}}
@media (max-width:720px){
 html{scrollbar-gutter:auto}
 header{position:static;display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px 12px;padding:12px 16px;overflow:visible}
 header h1{grid-column:2;grid-row:1}
 header .mark{grid-column:1;grid-row:1;flex-shrink:0}
 header .chip{grid-column:1/-1;min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;justify-content:flex-start}
 header #stats,header #latency,header #audiostats{min-width:0}
 header .spacer{display:none}
 #audiostats:empty{display:none}
 main{min-width:0;padding:16px}
 .dock,.dock .group,.audio-controls,.foot{min-width:0}
 .dock .group{gap:8px}
 .audio-controls{border-radius:12px}
 #record-info{width:auto;margin-left:0;margin-right:0}
 .recordings a,#message,#profile-info{overflow-wrap:anywhere}
 #profile-controls label{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px}
 #profile-controls select{max-width:100%;font-size:16px}
 .banner{display:none}
}

const video=document.getElementById('video'),message=document.getElementById('message'),record=document.getElementById('record');
let recording=false,stopped=false,statusBusy=false,recordingName="";
let profilesFetching=false;
async function fetchWithTimeout(path,options={},ms=5000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
 try{
  const response=await fetch(path,{cache:'no-store',...options,signal:controller.signal});
  // Keep the deadline active until the body arrives, not just its headers.
  const body=await response.text();
  return {ok:response.ok,status:response.status,json:async()=>JSON.parse(body)};
 }
 finally{clearTimeout(timer);}
}
let hiddenSince=document.hidden?Date.now():0;
let profileBusy=false,profileOptions='';
const resolution=document.getElementById('resolution'),applyResolution=document.getElementById('apply-resolution'),profileInfo=document.getElementById('profile-info');
async function refreshProfiles(){
 if(profilesFetching||stopped)return;
 profilesFetching=true;
 try{
 const response=await fetchWithTimeout('/config.json');if(!response.ok)return;
 const c=await response.json(),heights=(c.resolutions||[]).filter(h=>[720,1080,1440,2160].includes(h));
 const controls=document.getElementById('profile-controls'),hidden=!heights.length;
 if(controls.hidden!==hidden)controls.hidden=hidden;
 if(profileOptions!==heights.join(',')){profileOptions=heights.join(',');resolution.replaceChildren(...heights.map(h=>new Option(h+'p',h)));}
 profileBusy=!!c.profile_changing;
 const selectedHeight=String(c.requested_height||c.height);
 if(document.activeElement!==resolution&&resolution.value!==selectedHeight)resolution.value=selectedHeight;
 const disabled=profileBusy||recording;
 if(resolution.disabled!==disabled)resolution.disabled=disabled;
 if(applyResolution.disabled!==disabled)applyResolution.disabled=disabled;
 const text=c.profile_error?'Profile unavailable. The stream continues at '+c.height+'p.':profileBusy?'Applying resolution; reconnecting the stream...':recording?'Stop recording before changing resolution.':'Active: '+c.height+'p. Lower resolutions reduce network and decoding load.';
 if(profileInfo.textContent!==text)profileInfo.textContent=text;
 }finally{profilesFetching=false;}
}
applyResolution.onclick=async()=>{
 applyResolution.disabled=resolution.disabled=true;
 try{const r=await fetchWithTimeout('/capture/profile?height='+encodeURIComponent(resolution.value),{method:'POST'});const body=await r.json();if(!r.ok)throw new Error(body.message||'Resolution change failed.');await refreshProfiles();}
 catch(e){profileInfo.textContent=e.message;applyResolution.disabled=resolution.disabled=false;}
};
async function listRecordings(){const response=await fetchWithTimeout("/recordings");if(!response.ok)throw new Error('Recordings unavailable');const items=await response.json();const panel=document.getElementById("recordings");panel.replaceChildren();for(const item of items.reverse()){const link=document.createElement("a");link.href="/recordings/"+encodeURIComponent(item.name);link.download=item.name;link.textContent=item.name+" · "+(item.bytes/1048576).toFixed(1)+" MB";panel.appendChild(link);}if(!items.length)panel.textContent="No recordings yet";}
async function updateStatus(){
 if(statusBusy||stopped)return;statusBusy=true;
 try{const response=await fetchWithTimeout('/status.json');if(!response.ok)throw new Error('Status unavailable');const s=await response.json();recording=s.recording;const recordLabel=recording?'Stop recording':'Record';if(record.textContent!==recordLabel)record.textContent=recordLabel;record.classList.toggle('active',recording);document.getElementById('stats').textContent=`${s.width} × ${s.height} · ${s.fps.toFixed(1)} fps · ${s.kbps.toFixed(0)} kbit/s`;const info=document.getElementById('record-info');info.textContent=s.recording_error?'Recording failed: unable to write to the console.':recording?`Recording · ${s.recording_seconds.toFixed(1)} seconds · ${(s.recording_bytes/1048576).toFixed(2)} MB`:s.recording_name?`Saved · ${s.recording_seconds.toFixed(1)} seconds · ${(s.recording_bytes/1048576).toFixed(2)} MB`:'Not recording';const link=document.getElementById('download');link.hidden=!s.recording_name||recording;if(!link.hidden){link.href='/recordings/'+encodeURIComponent(s.recording_name);link.download=s.recording_name;}if(!recording&&s.recording_name!==recordingName){recordingName=s.recording_name;await listRecordings();}}
 catch(e){if(!currentPlayback&&!stopped)message.textContent='Connection lost. Reconnecting...';}
 finally{refreshProfiles().catch(()=>{});statusBusy=false;}
}
record.onclick=async()=>{record.disabled=true;try{const response=await fetchWithTimeout(recording?'/record/stop':'/record/start',{method:'POST'});if(!response.ok)throw new Error('The recording command failed.');await updateStatus();await listRecordings();}catch(e){document.getElementById('record-info').textContent=e.message;}finally{record.disabled=false;}};
document.getElementById('snapshot').onclick=()=>{if(!video.videoWidth)return;const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pbs.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);});};
document.getElementById('stop').onclick=async()=>{stopped=true;restartViewer('Stream stopped');video.pause();try{await fetchWithTimeout('/stop',{method:'POST'});}catch(e){message.textContent='Unable to stop: '+e.message;return;}message.textContent='Stream stopped. Capture resources have been released.';};
const VIDEO_IDLE_MS=9000, BUFFER_IDLE_MS=7000;
let currentPlayback=null;
function restartViewer(reason){if(currentPlayback)currentPlayback.abort(reason||'Reconnecting video');}
async function play(){
 const controller=new AbortController(),signal=controller.signal;
 let failure=null,reader=null,source=null,media=null,mediaUrl=null,watchdog=null;
 let lastFrame=Date.now(),lastAppend=Date.now(),lastPresented=Date.now();
 let presentedTime=video.currentTime,playbackBlocked=false;
 let sequence=1,queue=[],pending=new Uint8Array(),attemptingPlay=false;
 let previousPts=null,timeline=0,frameCallback=null,lastTrim=0;
 let pendingSample=null;
 let appendedKeys=[],lastKeyframe=Date.now(),lastKeyRequest=0,keyframeBusy=false;
 const fail=error=>{
  if(signal.aborted)return;
  failure=error instanceof Error?error:new Error(error);
  controller.abort();
  if(reader)reader.cancel().catch(()=>{});
 };
 const session={abort:fail};
 currentPlayback=session;
 const waiting=()=>{if(!stopped&&!signal.aborted)message.textContent='Buffering...';};
 const presented=()=>{
  if(!signal.aborted&&video.currentTime!==presentedTime){presentedTime=video.currentTime;lastPresented=Date.now();}
 };
 // A playing event can precede an actual decoded frame. Only renew the
 // render deadline here when the user has just allowed blocked autoplay.
 const playing=()=>{if(playbackBlocked){playbackBlocked=false;lastPresented=Date.now();}};
 const decoderError=()=>fail('Browser video decoder failed');
 let update=null,sourceError=null;
 video.addEventListener('waiting',waiting);
 if(!video.requestVideoFrameCallback)video.addEventListener('timeupdate',presented);
 video.addEventListener('playing',playing);
 video.addEventListener('error',decoderError);
 if(video.requestVideoFrameCallback){
  const track=()=>{if(signal.aborted)return;lastPresented=Date.now();frameCallback=video.requestVideoFrameCallback(track);};
  frameCallback=video.requestVideoFrameCallback(track);
 }
 watchdog=setInterval(()=>{
  if(stopped){controller.abort();return;}
